[project]
name = "deck-keeper"
version = "0.1.0"
description = "Self-hosted MTG decklists from photos using a local vision model"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "pillow>=10.4",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "joserfc>=1.0",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deck_keeper*"]

[tool.setuptools.package-data]
deck_keeper = ["migrations/*.ini", "migrations/*.py", "migrations/versions/*.py", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
